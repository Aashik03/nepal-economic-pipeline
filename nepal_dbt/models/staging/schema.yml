version: 2
models:
  - name: stg_nepal
    description: "Staging model for Nepal economic indicators"
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: year
        tests:
          - not_null
      - name: gdp_usd
        tests:
          - not_null
      - name: country
        tests:
          - not_null